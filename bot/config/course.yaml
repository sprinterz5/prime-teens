# ============================================================
# Шаблон курса PrimeTeens · летний интенсив
# Даты не хардкодятся: у каждой группы своя дата старта (день 1),
# остальные дни считаются как start_date + offset_days.
# ============================================================

# Смены. Время занятия — свойство группы, а не курса: две смены идут в один день.
shifts:
  morning: {label: "утро",  start: "10:00"}
  evening: {label: "вечер", start: "18:00"}

block_minutes: 40        # длительность блока
block_step_minutes: 50   # шаг между началами: 18:00 / 18:50 / 19:40

reminders:
  before_lesson_min: [120, 15]   # за сколько минут напомнить ментору об уроке
  checklist_after_min: 30        # через сколько минут после конца урока предложить опрос
  # Повторные напоминания, если опрос не заполнен. Часы считаются от конца
  # занятия, так что 8 — это через 8 часов после конца, 20 — на следующий день.
  # Ровно то расписание, что просит ТЗ.
  checklist_nudge_hours: [8, 20]

days:
  - index: 1
    offset_days: 0
    weekday: "Понедельник"
    title: "Знакомство и дебаты"
    week: 1
    blocks: ["Зачем курс? + Знакомство", "Дебаты", "Claude/Gemini + Google Calendar"]
    tasks: ["Нарисуйте успешный успех", "Бинго знакомств", "Нон-стоп мини-дебаты, 3 темы — группа",
            "Смена сторон", "План в календарь — не в тетради"]
    homework: "Добить календарь"

  - index: 2
    offset_days: 2
    weekday: "Среда"
    title: "Клубы и Community Service"
    week: 1
    blocks: ["Школьные клубы", "Community Service", "Интеллектуальная карта"]
    tasks: ["Клубы, которые мне подходят", "План моего клуба", "Матрица полезности — в парах",
            "Первый шаг за один вечер — в парах", "Мои интересы — mind map"]
    homework: "Добить mind map"

  - index: 3
    offset_days: 4
    weekday: "Пятница"
    title: "Исследования"
    week: 1
    # «Исследования» идут два блока подряд: там же и про исследовательские
    # программы. Это один урок на два слота, а не урок плюс дырка.
    blocks: [{name: "Исследования", span: 2}, "Ваше исследование"]
    tasks: ["По прошлому mind map", "Вопрос — гипотеза — метод",
            "Что нужно для моего исследования? Чек-лист и план"]
    homework: "Начать исследование, сделать опрос, презентация до следующей субботы"

  - index: 4
    offset_days: 5
    weekday: "Суббота"
    title: "Спид-дейтинг и MUN"
    week: 1
    start_override: "10:00"      # суббота у обеих смен утром
    block_step_minutes: 60       # 10:00 / 11:00 / 12:00
    # MUN занимает два часа — до 13:00 (в таблице это объединённая ячейка).
    blocks: ["Хакатон → Спид-дейтинг", {name: "MUN", span: 2}]
    tasks: ["Лист делегата"]
    homework: "Скачать Claude на следующий урок"

  - index: 5
    offset_days: 7
    weekday: "Понедельник"
    title: "Свой проект и вайбкодинг"
    week: 2
    blocks: ["Создание своего проекта + MVP", "Вайбкодинг", "Деление на команды по хакатону"]
    tasks: ["Урежь до MVP", "Четыре вопроса", "Питч на 60 секунд",
            "Сделать с Claude мини-игру — группа", "Опубликовать свой сайт на Replit"]
    homework: "Создать групповой чат команды, придумать название, выбрать кейс"

  - index: 6
    offset_days: 9
    weekday: "Среда"
    title: "Олимпиады и летние программы"
    week: 2
    blocks: ["Олимпиады", "Летние программы", "Прокачка навыков — курсы"]
    tasks: ["Поиск олимпиад с ИИ", "Выбрать из мечты 3 страны и 3 города, найти в них летние программы",
            "Каких навыков и знаний не хватает для олимпиад и программ?"]
    homework: "Чотам по хакатону и исследованию?"

  - index: 7
    offset_days: 11
    weekday: "Пятница"
    title: "CV и план на год"
    week: 2
    blocks: ["Составление CV", "Стажировки", "Помечтать + План на год"]
    tasks: ["Самоанализ", "Каркас моего CV", "Куда именно я напишу", "Мечта — ближайший год"]
    homework: "Чотам по хакатону и исследованию?"

  - index: 8
    offset_days: 12
    weekday: "Суббота"
    title: "Презентация исследования"
    week: 2
    start_override: "10:00"
    block_step_minutes: 60
    blocks: ["Презентация исследования", "Пицца", "Примеры работ"]
    tasks: []
    homework: "Чотам по хакатону и исследованию?"
    # после этого дня бот запускает финальный опрос и сборку характеристик
    final_checklist: true

  - index: 9
    offset_days: 13
    weekday: "Воскресенье"
    title: "Хакатон — защита"
    week: 2
    start_override: "10:00"
    duration_minutes: 180   # 10:00–13:00
    blocks: ["Хакатон — защита перед жюри"]
    tasks: []
    hackathon: true
    # хакатон не входит в подсчёт посещаемости обычных занятий (нет вопроса
    # "кого не было" в этом опросе) — но напоминание всё равно шлётся,
    # см. scheduler.py: для hackathon:true флаг ниже не блокирует опрос.
    post_lesson_checklist: false

# Когда напоминать ментору собрать характеристики
characteristics:
  after_day: 9          # после какого дня открывается финальный опрос (после хакатона)
  remind_at: "19:00"    # во сколько в этот день пнуть ментора

# Подсказка словаря для распознавания голосовых. Без неё Whisper калечит термины:
# MUN -> «МУН», кейс -> «Кейса». Имена учеников бот подставляет сам из состава
# группы — здесь только то, что общее для всех групп.
stt_vocabulary:
  - хакатон
  - MVP
  - MUN
  - дебаты
  - питч
  - кейс
  - гипотеза
  - исследовательский вопрос
  - постер
  - портфолио
  - резюме
  - CV
  - IELTS
  - олимпиада
  - стажировка
  - волонтёрство
  - дедлайн
  - защита перед жюри
  - вайбкодинг
  - Xmind
  - Miro
  - Replit
  - Claude
  - Gemini
  - mind map
  - интеллектуальная карта
  - спид-дейтинг

# Что делать после голосового ответа:
#   always — всегда спрашивать «сохранить?» (надёжно, но +1 нажатие на каждый ответ)
#   smart  — спрашивать только когда whisper сам не уверен в расшифровке
#   never  — просто сохранять; переписать можно кнопкой под расшифровкой
# Кнопка «Переписать» есть в любом режиме и работает на старых сообщениях тоже.
voice:
  confirm: smart
  # Порог avg_logprob: ниже — расшифровка сомнительная. Чистая речь на замерах
  # даёт -0.22; значение подобрано с запасом и его стоит уточнить на своих
  # записях — tools/test_stt.py печатает уверенность для любого файла.
  low_confidence: -0.6
  # Второй признак: слов в секунду. Русская речь идёт ~2 сл/с, так что если
  # на 20-секундной записи распозналось 5 слов — половину явно потеряли.
  min_words_per_sec: 0.6

# Воскресный дайджест: по кому за неделю не собрано ни одного эпизода.
digest:
  weekday: 6      # 0 = понедельник … 6 = воскресенье
  at: "12:00"
