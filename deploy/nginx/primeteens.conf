# PrimeTeens - nginx reverse proxy for the Next.js app (127.0.0.1:3000).
#
# SERVER_NAME: replace `_` below with your real domain once you have one
# (see ../HTTPS.md). `_` matches any Host header, which is what you want
# while the box is reachable only by bare IP.
#
# CERT PATHS: placeholders below assume certbot's default layout,
# /etc/letsencrypt/live/<name>/... where <name> is either your domain or,
# if you went the IP-certificate route, the IP address itself. Adjust to
# match whatever `certbot certificates` actually shows on your box.
#
# Install:
#   sudo cp deploy/nginx/primeteens.conf /etc/nginx/sites-available/primeteens.conf
#   sudo ln -s /etc/nginx/sites-available/primeteens.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx

# ---------------------------------------------------------------------------
# :80 - ACME http-01 challenge + redirect everything else to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # certbot --webroot writes challenge files here; keep this reachable
    # over plain HTTP even after HTTPS is up (renewals need it).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# :443 - TLS termination + reverse proxy to the Next.js app
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # --- TLS ---------------------------------------------------------------
    # Placeholder paths - point these at whatever certbot/acme.sh/lego
    # actually produced (domain name or IP address as the directory).
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN_OR_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_OR_IP/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS is deliberately left OFF by default. It is safe once you are on
    # a real domain with normal 90-day certs and reliable auto-renewal, but
    # dangerous on the short-lived (6-day) IP-certificate path from
    # ../HTTPS.md: a single missed renewal + HSTS in browser caches means
    # visitors cannot reach the site at all until it expires. Turn on only
    # after renewal has been observed working for a few cycles:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # --- Body size -----------------------------------------------------------
    # Drawing PUTs are up to 2 MB; 3m leaves headroom.
    client_max_body_size 3m;

    # --- Security headers ---------------------------------------------------
    # Intentionally NOT setting X-Frame-Options / frame-ancestors to a value
    # that blocks framing: the Mini App is opened inside the Telegram
    # webview and the app also iframes its own /workbook/frame. If you add
    # a frame-restricting header later, keep it SAMEORIGIN-compatible, e.g.
    # add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # --- SSE streams: no buffering, long read timeout -----------------------
    # Matches /api/workbook/<id>/stream and /api/mentor/groups/<id>/stream.
    location ~ ^/api/.*/stream$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Everything else -----------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
