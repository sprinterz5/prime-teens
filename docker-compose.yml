services:
  postgres:
    image: postgres:16-alpine
    container_name: primeteens-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: primeteens
      POSTGRES_USER: primeteens
      POSTGRES_PASSWORD: primeteens_dev_password
    ports:
      - "5432:5432"
    volumes:
      - primeteens-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primeteens -d primeteens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  primeteens-pg-data:
